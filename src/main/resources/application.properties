spring.application.name=d-shorts-backend
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

# --- Database (PostgreSQL only; schema is owned by src/main/resources/db/schema.sql) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dshorts}
spring.datasource.username=${DB_USERNAME:dshorts}
spring.datasource.password=${DB_PASSWORD:dshorts}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Session cookie (server-side HttpSession) ---
server.servlet.session.timeout=${SESSION_TIMEOUT:12h}
server.servlet.session.cookie.name=DSHORTS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# --- CORS (comma separated origin patterns) ---
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- Seed accounts (created on startup only when absent) ---
app.seed.admin-username=${ADMIN_USERNAME:}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.demo-username=${DEMO_USERNAME:}
app.seed.demo-password=${DEMO_PASSWORD:}
# Load topics/personas/fixture posts from classpath:seed/ when the topics table is empty
app.seed.dev-data=${DEV_SEED:true}

# --- AI provider (OpenAI-compatible chat completions) ---
app.ai.provider=${AI_PROVIDER:}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.image-model=${AI_IMAGE_MODEL:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.connect-timeout=${AI_CONNECT_TIMEOUT:10s}
app.ai.read-timeout=${AI_READ_TIMEOUT:60s}

springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# Admin image upload (MediaStorage enforces app.media.max-image-bytes, default 5MB)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
