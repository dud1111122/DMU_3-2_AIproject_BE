spring.application.name=d-shorts-backend
server.port=8080
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:h2:file:./.local/dshorts;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
app.user.header=X-Anonymous-User-Id
app.ai.provider=${AI_PROVIDER:}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.admin.token=${ADMIN_TOKEN:}
