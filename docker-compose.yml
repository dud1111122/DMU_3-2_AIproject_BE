services:
  postgres:
    image: postgres:16-alpine
    container_name: dshorts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dshorts
      POSTGRES_USER: dshorts
      POSTGRES_PASSWORD: dshorts
    ports: ["5432:5432"]
    volumes: [dshorts-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dshorts -d dshorts"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dshorts-postgres-data:
